name: Pipeline CI/CD

on:
  push:
    branches:
      - main
      - develop
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    name: Build e Testes Unitários
    runs-on: ubuntu-latest

    # os comandos rodam dentro do módulo client
    defaults:
      run:
        working-directory: ./client

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Baixar dependências do Maven
        run: ./mvnw -B dependency:go-offline

      - name: Build, testes e empacotamento
        run: ./mvnw -B verify
